<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@350;600;700;800&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1240px;height:528px;overflow:hidden;background:#030611;font-family:'Source Sans 3',sans-serif}
 .h{position:relative;width:1240px;height:528px;overflow:hidden}
 .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.52) saturate(.92)}
 .scrim{position:absolute;inset:0;background:linear-gradient(96deg,rgba(3,6,17,.97) 0%,rgba(3,6,17,.92) 30%,rgba(3,6,17,.62) 54%,rgba(3,6,17,.22) 78%,rgba(3,6,17,.10) 100%)}
 .vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,6,17,.35),transparent 30%,transparent 68%,rgba(3,6,17,.55))}
 .c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding-left:64px;max-width:800px}
 .evt{font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9AA2B8;margin-bottom:22px}
 .pill{display:inline-flex;width:fit-content;font-size:21px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
   padding:11px 26px;border-radius:999px;margin-bottom:26px;background:rgba(79,124,255,.20);color:#AFC4FF;border:2px solid rgba(79,124,255,.5)}
 .t{font-size:62px;font-weight:800;color:#fff;line-height:1.02;letter-spacing:-.028em}
 .rule{margin-top:30px;width:190px;height:5px;border-radius:3px;
   background:linear-gradient(90deg,#22D3EE,#4F7CFF 38%,#8B5CF6 70%,#E34FCB)}
</style></head><body>
<div class="h"><img class="bg" src="both-strip.jpg"><div class="scrim"></div><div class="vig"></div>
 <div class="c"><div class="evt">Modern Post in Premiere</div>
  <div class="pill">One week to go</div><div class="t">Two live days.<br>180 days of access.</div><div class="rule"></div></div>
</div></body></html>
