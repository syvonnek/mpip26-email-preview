<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1240px;height:640px;overflow:hidden;background:#030611}
  .stage{position:relative;width:1240px;height:640px;background:#030611;font-family:'Source Sans 3',sans-serif}
  .carwrap{position:absolute;top:0;right:0;bottom:0;left:600px;overflow:hidden}
  .carwrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:58% 50%}
  .carwrap::before{content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(90deg,#030611 0%,rgba(3,6,17,.94) 8%,rgba(3,6,17,.78) 18%,rgba(3,6,17,.5) 30%,rgba(3,6,17,.22) 44%,rgba(3,6,17,.04) 58%,transparent 72%);}
  .carwrap::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(3,6,17,.42) 0%,transparent 26%)}
  .prbadge{position:absolute;top:34px;right:34px;z-index:4;width:96px;height:96px;border-radius:20px;display:block;
    box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)}
  .copy{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 0 0 64px;max-width:660px}
  .kicker{width:fit-content;font-size:27px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e4e8f5;
    padding:13px 28px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);margin-bottom:32px}
  h1{font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.02em;color:#ffffff}
  .sub{margin-top:16px;font-size:36px;font-weight:700;letter-spacing:-.01em;line-height:1.16;
    background:linear-gradient(100deg,#22D3EE 0%,#4F7CFF 34%,#8B5CF6 67%,#E34FCB 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .facts{margin-top:38px;display:flex;gap:36px;align-items:center}
  .fact .k{font-size:25px;font-weight:700;color:#f5f7fb;letter-spacing:-.005em}
  .fdiv{width:1px;height:32px;background:rgba(255,255,255,.18)}
</style></head>
<body>
<div class="stage">
  <div class="carwrap"><img src="hero-car-src.png"></div>
  <svg class="prbadge" viewBox="0 0 234 234" xmlns="http://www.w3.org/2000/svg">
    <rect width="234" height="234" rx="42" fill="#00005b"/>
    <path d="M88.24,62.11c30.59,0,47.82,14.33,47.82,38.32,0,28.01-23.34,39.28-45.24,39.28h-14.81v30.27h-29.94V62.11h42.18ZM76,87.71v26.4h13.2c9.18,0,15.62-3.7,15.62-13.04,0-8.53-5.47-13.36-14.97-13.36h-13.85Z" fill="#99f"/>
    <path d="M177.8,84.49c6.6,0,11.91.81,14.33,1.61v21.9c-1.93-.49-5.63-.81-8.69-.81-5.96,0-9.34.49-12.4,1.61v61.18h-28.17v-78.4c10.14-4.51,20.29-7.08,34.94-7.08Z" fill="#99f"/>
  </svg>
  <div class="copy">
    <div class="kicker">Live Online Training</div>
    <h1>Modern Post<br>in Premiere</h1>
    <div class="sub">Color Mode + AI-Assisted<br>Post-Production</div>
    <div class="facts">
      <div class="fact"><span class="k">Sept 29&ndash;30, 2026</span></div>
      <div class="fdiv"></div>
      <div class="fact"><span class="k">Live on Zoom</span></div>
    </div>
  </div>
</div>
</body></html>
