<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;padding:40px;font-family:-apple-system,sans-serif}
  .label{color:#8b90a5;font-size:13px;margin-bottom:10px}
  .frame{width:558px;height:190px;overflow:hidden;border-radius:12px;border:2px solid #333;margin-bottom:40px}
  /* NUDGE ME: select the <img class="tune"> below, open the Styles pane,
     find "object-position" and edit the two percentages (or use the
     up/down arrow keys after clicking a value to nudge by 1%).
     0% 0% = top-left of the source image. 100% 100% = bottom-right. */
  .tune{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
</style></head>
<body>
  <div class="label">DAY 1 CARD — 558&times;190 — img.tune object-position: 50% 50%</div>
  <div class="frame"><img class="tune" id="day1" src="../drive-src/screens/day1/02 Lab 1 - Primary Correction.png"></div>

  <div class="label">DAY 2 CARD — 558&times;190 — img.tune object-position: 50% 50%</div>
  <div class="frame"><img class="tune" id="day2" src="../drive-src/screens/day2/01 Find the Story in the Footage.jpg"></div>
</body></html>
