<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Page background options</title>
<style>body{margin:0;font-family:monospace;color:#ccc;background:#000}
.row{display:flex;align-items:center;gap:16px;padding:14px 20px}
.sw{width:340px;height:70px;border-radius:6px;border:1px solid #333}
.card{width:70px;height:70px;background:#000;border:1px solid rgba(255,255,255,.16);border-radius:6px;margin-left:-90px;margin-top:8px}
</style></head><body>
<div class="row"><div class="sw" style="background:#191c23"></div><div class="card"></div><span>1 — current: neutral cool grey #191c23</span></div>
<div class="row"><div class="sw" style="background:#121417"></div><div class="card"></div><span>2 — near-black, barely-there separation #121417</span></div>
<div class="row"><div class="sw" style="background:#14161c"></div><div class="card"></div><span>3 — slightly blue-black #14161c</span></div>
<div class="row"><div class="sw" style="background:#1a1310"></div><div class="card"></div><span>4 — warm dark (picks up the desert tone) #1a1310</span></div>
<div class="row"><div class="sw" style="background:#0f1115"></div><div class="card"></div><span>5 — matches old card exactly minus 1 step #0f1115</span></div>
</body></html>
